services:
  db:
    image: postgres:16-alpine
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-salon}
      POSTGRES_USER: ${DB_USER:-salon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-salon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-salon} -d ${DB_NAME:-salon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salon-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
